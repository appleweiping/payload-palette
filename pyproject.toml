[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "payload-palette"
version = "0.4.0"
description = "Validate and normalize ordered multimodal request payloads without fetching remote media."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "appleweiping" }]
maintainers = [{ name = "appleweiping" }]
keywords = ["multimodal", "validation", "base64", "manifest", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit>=1.7",
  "build>=1.2",
  "check-wheel-contents>=0.6",
  "hatchling==1.32.0",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "twine>=7.0",
]

[project.scripts]
payload-palette = "payload_palette.cli:main"

[project.urls]
Documentation = "https://github.com/appleweiping/payload-palette#readme"
Issues = "https://github.com/appleweiping/payload-palette/issues"
Source = "https://github.com/appleweiping/payload-palette"

[tool.hatch.build.targets.wheel]
packages = ["src/payload_palette"]

[tool.hatch.build.targets.sdist]
include = [
  "/CITATION.cff",
  "/CHANGELOG.md",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/GOVERNANCE.md",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/benchmarks",
  "/docs",
  "/examples",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/uv.lock",
]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]
# tests/test_benchmarks.py imports the repo-root `benchmarks` package, which is not
# installed with the distribution. CI currently runs `python -m pytest`, which puts
# the working directory on sys.path and hides this; declaring it explicitly keeps a
# bare `pytest` invocation working too.
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["payload_palette"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["build", "dist", ".venv*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.bandit]
targets = ["src"]
