name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy
      - name: Test with branch coverage
        run: python -m pytest --cov=payload_palette --cov-branch --cov-report=term-missing
      - name: Verify generated demo
        run: python examples/build_demo.py --output-dir demo-output --check
      - name: Smoke-test benchmark protocol
        if: matrix.python-version == '3.14'
        run: python benchmarks/benchmark_ingress.py --repeats 3 --operations 2 --output benchmark-output.json
      - name: Build distributions
        run: python -m build

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix job to succeed
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "${MATRIX_RESULT}" = success
