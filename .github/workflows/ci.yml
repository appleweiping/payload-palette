name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          enable-cache: false
      - name: Synchronize locked test environment
        run: uv sync --frozen --extra dev
      - name: Lint
        run: uv run --frozen --extra dev python -m ruff check .
      - name: Format check
        run: uv run --frozen --extra dev python -m ruff format --check .
      - name: Type check
        run: uv run --frozen --extra dev python -m mypy
      - name: Security scan
        run: uv run --frozen --extra dev python -m bandit -q -c pyproject.toml -r src
      - name: Test with branch coverage
        run: uv run --frozen --extra dev python -m pytest --cov=payload_palette --cov-branch --cov-report=term-missing
      - name: Check offline corpus research code
        if: matrix.python-version == '3.14' || matrix.os == 'windows-latest'
        run: |
          uv run --frozen --extra dev python -m mypy --strict benchmarks/corpus.py benchmarks/corpus_cases.py benchmarks/corpus_replay.py benchmarks/corpus_worker.py benchmarks/corpus_cli.py
          uv run --frozen --extra dev python -m bandit -q benchmarks/corpus.py benchmarks/corpus_cases.py benchmarks/corpus_replay.py benchmarks/corpus_worker.py benchmarks/corpus_cli.py
      - name: Test separate research-code branch coverage
        if: matrix.python-version == '3.14' || matrix.os == 'windows-latest'
        run: uv run --frozen --extra dev python -m pytest tests/test_corpus.py tests/test_corpus_admission.py tests/test_corpus_reports.py --cov=benchmarks.corpus --cov=benchmarks.corpus_cases --cov=benchmarks.corpus_replay --cov=benchmarks.corpus_worker --cov=benchmarks.corpus_cli --cov-branch --cov-fail-under=95 --cov-report=term-missing -W error::RuntimeWarning -W error::ResourceWarning
      - name: Replay fixed offline corpus smoke partition
        if: matrix.python-version == '3.14' || matrix.os == 'windows-latest'
        run: uv run --frozen --extra dev python -m benchmarks.corpus_cli run --smoke --timeout 30 --output corpus-smoke-output.json
      - name: Verify generated demo
        run: uv run --frozen --extra dev python examples/build_demo.py --output-dir demo-output --check
      - name: Smoke-test benchmark protocol
        if: matrix.python-version == '3.14'
        run: uv run --frozen --extra dev python benchmarks/benchmark_ingress.py --repeats 3 --operations 2 --output benchmark-output.json
      - name: Build distributions
        run: uv run --frozen --extra dev python -m build --no-isolation

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix job to succeed
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: test "${MATRIX_RESULT}" = success
